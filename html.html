<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوكونا - ربط واتساب</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<style>
:root {
--primary: #0a0a0a;
--secondary: #d4af37;
--accent: #8b0000;
--text: #f5f5f5;
--border: rgba(212,175,55,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
background: var(--primary);
color: var(--text);
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background-image: radial-gradient(circle at 20% 30%, rgba(139,0,0,0.15) 0%, transparent 60%);
}
.container {
width:100%;
max-width:460px;
background:rgba(10,10,10,0.9);
backdrop-filter:blur(10px);
border-radius:20px;
padding:30px;
border:1px solid var(--border);
box-shadow:0 0 40px rgba(212,175,55,0.1);
}
.header { text-align:center; margin-bottom:30px; }
.logo {
width:80px; height:80px;
margin:0 auto 16px;
background:linear-gradient(135deg, var(--secondary), var(--accent));
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
color:#000;
box-shadow:0 0 30px rgba(212,175,55,0.3);
}
.title { font-size:28px; font-weight:800; color:var(--secondary); letter-spacing:2px; }
.subtitle { font-size:14px; color:rgba(255,255,255,0.6); margin-top:8px; }
.social-icons {
display:flex;
justify-content:center;
gap:15px;
margin:20px 0;
}
.social-icons a {
width:44px; height:44px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:18px;
text-decoration:none;
transition:0.3s;
background:rgba(255,255,255,0.05);
border:1px solid var(--border);
}
.social-icons a:hover { transform:scale(1.1); background:var(--secondary); color:#000; }
.toggle-container {
display:flex;
margin-bottom:25px;
background:rgba(255,255,255,0.05);
border-radius:12px;
padding:4px;
border:1px solid var(--border);
}
.toggle-option {
flex:1;
padding:10px;
text-align:center;
cursor:pointer;
border-radius:8px;
font-weight:600;
transition:0.3s;
color:rgba(255,255,255,0.5);
}
.toggle-option.active {
background:var(--secondary);
color:#000;
}
.toggle-option:hover:not(.active) { background:rgba(255,255,255,0.05); }
.input-group { margin-bottom:20px; }
.input-label { display:block; margin-bottom:8px; font-weight:500; font-size:13px; color:rgba(255,255,255,0.7); }
.input-field {
width:100%;
padding:14px;
border:1.5px solid var(--border);
border-radius:12px;
background:rgba(255,255,255,0.05);
color:#fff;
font-size:15px;
outline:none;
transition:0.3s;
}
.input-field:focus { border-color:var(--secondary); box-shadow:0 0 20px rgba(212,175,55,0.1); }
.generate-btn {
width:100%;
padding:14px;
background:linear-gradient(135deg, var(--secondary), var(--accent));
border:none;
border-radius:12px;
color:#000;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:0.3s;
margin-bottom:16px;
}
.generate-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(212,175,55,0.3); }
.code-display {
background:rgba(255,255,255,0.05);
padding:16px;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:600;
margin-bottom:16px;
border:1px solid var(--border);
min-height:50px;
display:flex;
align-items:center;
justify-content:center;
color:var(--secondary);
}
.qr-display {
display:none;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:12px;
text-align:center;
margin-bottom:16px;
border:1px solid var(--border);
}
.qr-image { max-width:100%; border-radius:12px; margin-bottom:16px; }
.qr-instructions { font-size:13px; color:rgba(255,255,255,0.6); line-height:1.6; }
.copy-btn {
width:100%;
padding:12px;
background:rgba(255,255,255,0.05);
border:1.5px solid var(--border);
border-radius:12px;
color:#fff;
font-weight:600;
cursor:pointer;
transition:0.3s;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}
.copy-btn:hover { background:var(--secondary); color:#000; border-color:var(--secondary); }
.loading { display:none; text-align:center; margin:16px 0; }
.loading i { font-size:24px; color:var(--secondary); animation:spin 1s linear infinite; }
@keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
.footer { text-align:center; margin-top:25px; font-size:12px; color:rgba(255,255,255,0.3); }
.success-message { color:#4caf50; }
.error-message { color:#f44336; }
.hidden { display:none; }
@media (max-width:480px){ .container{padding:20px;} }
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo"><i class="fas fa-skull"></i></div>
<h1 class="title">⚔️ سوكونا ⚔️</h1>
<p class="subtitle">ربط جهاز واتساب</p>
<div class="social-icons">
<a href="#" class="youtube"><i class="fab fa-youtube"></i></a>
<a href="#" class="telegram"><i class="fab fa-telegram-plane"></i></a>
<a href="#" class="whatsapp"><i class="fab fa-whatsapp"></i></a>
<a href="#" class="github"><i class="fab fa-github"></i></a>
</div>
</div>
<div class="toggle-container">
<div class="toggle-option active" data-mode="pair"><i class="fas fa-key"></i> كود ربط</div>
<div class="toggle-option" data-mode="qr"><i class="fas fa-qrcode"></i> QR</div>
</div>
<div class="input-group" id="inputGroup">
<label class="input-label">أدخل رقم واتساب مع مفتاح الدولة</label>
<input type="text" id="mobileNumber" class="input-field" placeholder="+201234567890">
</div>
<button class="generate-btn" id="submit"><i class="fas fa-key"></i> إنشاء كود الربط</button>
<div class="loading" id="loading"><i class="fas fa-spinner"></i></div>
<div class="code-display" id="codeDisplay">سينتج الكود هنا</div>
<div class="qr-display" id="qrDisplay">
<img id="qrImage" class="qr-image" src="" alt="QR">
<div class="qr-instructions" id="qrInstructions">امسح الكود من واتساب</div>
</div>
<button class="copy-btn" id="copy" onclick="copyCode()"><i class="fas fa-copy"></i> نسخ الكود</button>
<div class="footer">© 2026 ᴘʜʏꜱɪᴄꜱ ᴛᴇᴀᴍ | سوكونا</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
<script>
let currentMode='pair';
document.querySelectorAll('.toggle-option').forEach(opt=>{
opt.addEventListener('click',function(){
const mode=this.dataset.mode;
if(mode===currentMode)return;
document.querySelectorAll('.toggle-option').forEach(o=>o.classList.remove('active'));
this.classList.add('active');
currentMode=mode;
const btn=document.getElementById('submit');
const input=document.getElementById('inputGroup');
if(mode==='pair'){
btn.innerHTML='<i class="fas fa-key"></i> إنشاء كود الربط';
btn.classList.remove('hidden');
input.classList.remove('hidden');
}else{
btn.classList.add('hidden');
input.classList.add('hidden');
generateQR();
}
document.getElementById('codeDisplay').innerHTML='سينتج الكود هنا';
document.getElementById('qrDisplay').style.display='none';
document.getElementById('codeDisplay').style.display='flex';
});
});
async function generateQR(){
const codeDisplay=document.getElementById('codeDisplay');
const qrDisplay=document.getElementById('qrDisplay');
const loading=document.getElementById('loading');
loading.style.display='block';
codeDisplay.innerHTML='';
qrDisplay.style.display='none';
try{
const res=await axios('/qr');
if(res.data.qr){
document.getElementById('qrImage').src=res.data.qr;
document.getElementById('qrInstructions').innerHTML=res.data.instructions.join('<br>');
qrDisplay.style.display='block';
codeDisplay.style.display='none';
}else{
codeDisplay.innerHTML='<div class="error-message"><i class="fas fa-exclamation-circle"></i> فشل توليد QR</div>';
codeDisplay.style.display='flex';
}
}catch(err){
codeDisplay.innerHTML='<div class="error-message"><i class="fas fa-exclamation-circle"></i> خطأ في توليد QR</div>';
codeDisplay.style.display='flex';
}finally{loading.style.display='none';}
}
document.getElementById('submit').addEventListener('click',async(e)=>{
e.preventDefault();
const num=document.getElementById('mobileNumber').value.trim();
if(!num){
document.getElementById('codeDisplay').innerHTML='<div class="error-message"><i class="fas fa-exclamation-circle"></i> أدخل الرقم</div>';
return;
}
const loading=document.getElementById('loading');
const codeDisplay=document.getElementById('codeDisplay');
loading.style.display='block';
codeDisplay.innerHTML='';
try{
const res=await axios(`/pair?number=${num.replace(/[^0-9]/g,'')}`);
const code=res.data.code||'Service Unavailable';
if(code==='Service Unavailable'){
codeDisplay.innerHTML='<div class="error-message"><i class="fas fa-exclamation-circle"></i> الخدمة غير متاحة</div>';
}else{
codeDisplay.innerHTML=`<div class="success-message"><i class="fas fa-check-circle"></i> الكود: ${code}</div>`;
}
codeDisplay.style.display='flex';
}catch(err){
codeDisplay.innerHTML='<div class="error-message"><i class="fas fa-exclamation-circle"></i> خطأ في توليد الكود</div>';
codeDisplay.style.display='flex';
}finally{loading.style.display='none';}
});
function copyCode(){
const text=document.getElementById('codeDisplay').innerText;
const code=text.replace('الكود: ','').trim();
navigator.clipboard.writeText(code).then(()=>{
const btn=document.getElementById('copy');
btn.innerHTML='<i class="fas fa-check"></i> تم النسخ!';
setTimeout(()=>{btn.innerHTML='<i class="fas fa-copy"></i> نسخ الكود';},2000);
}).catch(()=>{});
}
</script>
</body>
</html>
