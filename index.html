<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوكونا | منصة توسيع النطاق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#0a0a0a;--bg-card:#141414;--accent-red:#8B0000;--accent-gold:#D4AF37;--text-main:#e0e0e0;}
body{font-family:'Cairo',sans-serif;background-color:var(--bg-dark);color:var(--text-main);margin:0;padding:0;display:flex;flex-direction:column;align-items:center;min-height:100vh;background-image:radial-gradient(circle at center,#1a0000 0%,#0a0a0a 70%);}
.container{max-width:800px;width:90%;margin:40px auto;text-align:center;}
.header h1{font-size:3rem;font-weight:900;color:var(--accent-red);text-shadow:0 0 15px rgba(139,0,0,0.5);margin:0;letter-spacing:2px;}
.header p{color:var(--accent-gold);font-size:1.2rem;margin-top:10px;font-weight:700;}
.domain-expansion{font-size:1.5rem;color:#fff;margin-bottom:30px;opacity:0.8;border-bottom:2px solid var(--accent-red);display:inline-block;padding-bottom:5px;}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.card{background:var(--bg-card);border:1px solid #333;border-radius:15px;padding:30px;width:300px;box-shadow:0 10px 30px rgba(0,0,0,0.5);transition:transform 0.3s,border-color 0.3s;}
.card:hover{transform:translateY(-10px);border-color:var(--accent-red);}
.card h2{color:var(--accent-gold);margin-top:0;}
.btn{background:linear-gradient(45deg,var(--accent-red),#5a0000);color:white;border:none;padding:12px 25px;font-size:1.1rem;font-family:'Cairo',sans-serif;font-weight:700;border-radius:8px;cursor:pointer;width:100%;margin-top:15px;transition:0.3s;}
.btn:hover{background:linear-gradient(45deg,#a00000,var(--accent-red));box-shadow:0 0 15px var(--accent-red);}
.input-group{margin-top:20px;text-align:right;}
.input-group label{display:block;margin-bottom:8px;color:#aaa;}
.input-group input{width:100%;padding:12px;background:#000;border:1px solid #444;color:white;border-radius:8px;font-family:'Cairo',sans-serif;box-sizing:border-box;}
.footer{margin-top:50px;color:#555;font-size:0.9rem;}
.footer span{color:var(--accent-red);font-weight:bold;}
#result-box,#qr-box{margin-top:20px;padding:15px;background:#000;border:1px dashed var(--accent-gold);border-radius:8px;display:none;word-break:break-all;}
#qr-box img{max-width:100%;border-radius:10px;border:2px solid var(--accent-red);}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>SUKUNA</h1>
<p>منصة الربط الاحترافية للبوتات الفرعية</p>
<div class="domain-expansion">توسيع النطاق: ضريح الشر</div>
</div>
<div class="cards">
<div class="card">
<h2>الربط برقم الهاتف</h2>
<p>احصل على كود مكون من 8 أرقام لربط واتساب بدون كاميرا.</p>
<div class="input-group">
<label>رقم الهاتف (مع الكود الدولي):</label>
<input type="text" id="phone" placeholder="201033570865">
</div>
<button class="btn" onclick="getPairCode()">استخراج الكود</button>
<div id="result-box"></div>
</div>
<div class="card">
<h2>الربط بكود QR</h2>
<p>امسح الكود بكاميرا واتساب للربط الفوري.</p>
<button class="btn" onclick="getQRCode()">توليد الكود</button>
<div id="qr-box"></div>
</div>
</div>
<div class="footer">
<p>© 2026 <span>Adam (Shadow) & Sukuna Team</span>. جميع الحقوق محفوظة.</p>
</div>
</div>
<script>
async function getPairCode(){
const num=document.getElementById('phone').value;
if(!num)return alert('ادخل الرقم');
const box=document.getElementById('result-box');
box.style.display='block';box.innerText='جاري طلب الكود...';
try{
const res=await fetch(`/pair?number=${num}`);
const data=await res.json();
if(data.code){box.innerHTML=`<h3>كود الربط:</h3><h1 style="color:var(--accent-gold);letter-spacing:5px;">${data.code}</h1>`;}
else if(data.success){box.innerHTML=`<h3 style="color:green;">✅ ${data.message}</h3>`;}
else{box.innerText=data.code||'حصل خطأ';}
}catch(e){box.innerText='فشل الاتصال بالسيرفر';}
}
async function getQRCode(){
const box=document.getElementById('qr-box');
box.style.display='block';box.innerHTML='<p>جاري توليد الكود...</p>';
try{
const res=await fetch('/qr');
const data=await res.json();
if(data.qr){box.innerHTML=`<img src="${data.qr}" alt="QR Code">`;}
else{box.innerText=data.code||'حصل خطأ';}
}catch(e){box.innerText='فشل الاتصال بالسيرفر';}
}
</script>
</body>
</html>
